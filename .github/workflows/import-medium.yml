name: Import Medium posts

# Scrapes Medium posts (including ones older than the last 10 in the RSS feed)
# and pushes them to the deployed server's POST /api/import endpoint.
#
# Setup (repository Settings -> Secrets and variables -> Actions):
#   secrets.IMPORT_TOKEN   same value as IMPORT_TOKEN on the server
#   vars.SITE_URL          public URL of the server, e.g. https://blog.example.com
#   vars.MEDIUM_FEED_URL   e.g. https://medium.com/feed/@zfir (or vars.MEDIUM_USER=@zfir)
# The job skips itself when IMPORT_TOKEN or SITE_URL is missing (e.g. on forks).
# Optional importer tunables (same names and defaults as in the README):
#   MEDIUM_FETCH_TIMEOUT_MS, CHROME_TIMEOUT_MS, CHROME_VIRTUAL_TIME_BUDGET_MS,
#   IMPORT_PUSH_TIMEOUT_MS, IMPORT_REMOTE_IDS_TIMEOUT_MS, IMPORT_DELAY_MS,
#   MEDIUM_USER_AGENT, CHROME_PATH

on:
  schedule:
    - cron: '23 */12 * * *'
  workflow_dispatch:
    inputs:
      urls:
        description: 'Extra post URLs (space-separated), e.g. publication posts missing from the sitemap'
        required: false
        default: ''
      force:
        description: 'Re-import posts the server already has (overwrite)'
        type: boolean
        default: false

concurrency:
  group: import-medium
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  import:
    name: Import
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMPORT_TOKEN: ${{ secrets.IMPORT_TOKEN }}
      SITE_URL: ${{ vars.SITE_URL }}
      MEDIUM_FEED_URL: ${{ vars.MEDIUM_FEED_URL }}
      MEDIUM_USER: ${{ vars.MEDIUM_USER }}
      # Ubuntu 24.04 runners restrict user namespaces, which Chrome's sandbox needs.
      CHROME_NO_SANDBOX: '1'
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$IMPORT_TOKEN" ] || [ -z "$SITE_URL" ]; then
            echo "::notice::IMPORT_TOKEN secret or SITE_URL variable is not set; skipping import."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$MEDIUM_FEED_URL" ] && [ -z "$MEDIUM_USER" ]; then
            echo "::notice::Set the MEDIUM_FEED_URL or MEDIUM_USER variable; skipping import."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.skip != 'true'

      # The importer has no npm dependencies, so no `npm ci` is needed.
      - uses: actions/setup-node@v4
        if: steps.config.outputs.skip != 'true'
        with:
          node-version: 20

      - name: Import and push
        if: steps.config.outputs.skip != 'true'
        env:
          EXTRA_URLS: ${{ github.event.inputs.urls }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -- --profile
          if [ -n "$MEDIUM_USER" ]; then set -- "$@" "$MEDIUM_USER"; fi
          if [ "$FORCE" = "true" ]; then set -- "$@" --force; fi
          # Medium may challenge runner IPs; the importer then falls back to
          # headless Chrome (preinstalled on ubuntu-latest) and the Wayback Machine.
          # shellcheck disable=SC2086
          node server/scripts/import-medium.js "$@" --push "$SITE_URL" $EXTRA_URLS
